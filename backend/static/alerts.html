<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alerts — RPHMS</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="name">RPHMS</div>
      <div class="tag">Remote Health Monitoring</div>
    </div>
    <nav>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/alerts.html" class="active">Alerts</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-name" id="userName">—</div>
      <button id="logoutBtn">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Alerts</h1>
        <div class="subtitle">Critical readings across all patients</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>All alerts</h2>
        <span class="subtitle" id="lastUpdated" style="font-size:12px; color:var(--ink-muted);"></span>
      </div>
      <div class="panel-body" id="alertsList">
        <div class="empty-state">Loading…</div>
      </div>
    </div>
  </main>

</div>

<script src="/static/app.js"></script>
<script>
requireAuth();
document.getElementById("userName").textContent = getUserName();
document.getElementById("logoutBtn").addEventListener("click", logout);

const POLL_INTERVAL_MS = 4000;
let patientNameCache = {};

async function loadPatientNames() {
  try {
    const patients = await apiRequest("/api/patients");
    patientNameCache = {};
    patients.forEach(p => { patientNameCache[p.id] = p; });
  } catch (err) {
    console.error("Failed to load patients:", err);
  }
}

async function acknowledgeAlert(alertId) {
  try {
    await apiRequest(`/api/alerts/${alertId}/acknowledge`, { method: "POST" });
    await refreshAlerts();
  } catch (err) {
    alert("Could not acknowledge alert: " + err.message);
  }
}
window.acknowledgeAlert = acknowledgeAlert;

function renderAlerts(alerts) {
  const list = document.getElementById("alertsList");
  if (!alerts.length) {
    list.innerHTML = `<div class="empty-state">No alerts yet.</div>`;
    return;
  }

  list.innerHTML = alerts.map(a => {
    const patient = patientNameCache[a.patient_id];
    const patientLink = patient
      ? `<a href="/patient.html?id=${patient.id}" style="font-weight:600; color:var(--ink); text-decoration:none;">${escapeHtml(patient.name)}</a>`
      : "";
    return `
      <div class="alert-item ${a.acknowledged ? "acknowledged" : ""}" style="align-items:center;">
        <div>
          ${patientLink ? patientLink + "<br>" : ""}
          <span class="msg">${escapeHtml(a.message)}</span>
        </div>
        <div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
          <span class="time">${formatDateTime(a.created_at)}</span>
          ${a.acknowledged
            ? `<span class="badge normal" style="animation:none;">Acknowledged</span>`
            : `<button class="btn btn-small" onclick="acknowledgeAlert(${a.id})">Acknowledge</button>`
          }
        </div>
      </div>
    `;
  }).join("");
}

async function refreshAlerts() {
  try {
    const alerts = await apiRequest("/api/alerts");
    renderAlerts(alerts);
    document.getElementById("lastUpdated").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (err) {
    console.error("Failed to refresh alerts:", err);
  }
}

async function init() {
  await loadPatientNames();
  await refreshAlerts();
}

init();
setInterval(refreshAlerts, POLL_INTERVAL_MS);
</script>

</body>
</html>
