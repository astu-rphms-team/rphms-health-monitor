<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPHMS — Sign in</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M3 12h4l2-7 4 14 2-7h6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1 class="display">RPHMS</h1>
      <p>Remote Patient Health Monitoring — provider sign in</p>
    </div>

    <div class="form-error" id="loginError"></div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:10px;">
        Sign in
      </button>
    </form>

    <div class="demo-hint">Default demo login — username: <strong>admin</strong>, password: <strong>admin123</strong></div>
  </div>
</div>

<script src="/static/app.js"></script>
<script>
  if (getToken()) {
    window.location.href = "/dashboard.html";
  }

  const form = document.getElementById("loginForm");
  const errorBox = document.getElementById("loginError");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("visible");

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    try {
      const data = await apiRequest("/api/login", {
        method: "POST",
        body: JSON.stringify({ username, password }),
      });
      setSession(data.token, data.name);
      window.location.href = "/dashboard.html";
    } catch (err) {
      errorBox.textContent = err.message || "Invalid username or password";
      errorBox.classList.add("visible");
    }
  });
</script>

</body>
</html>
